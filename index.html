<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMaraderie '26 Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #5C94FC;
            --brick-main: #E75926;
            --brick-light: #f08050;
            --brick-dark: #8a2e00;
            --grass-green: #709132;
            --gold: #F7D010;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--sky-blue);
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- 1:1 标题比例优化 --- */
        .header { margin-top: 50px; text-align: center; padding: 0 20px; }
        .header h1 {
            font-size: clamp(24px, 8vw, 64px); margin: 0; color: white;
            /* 极细致的多层投影模拟像素勾边 */
            text-shadow: 
                -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
                0px 10px 0px #8a4a2a; 
            letter-spacing: -2px;
            line-height: 1.2;
        }

        /* --- 领奖台重构 --- */
        .podium-section {
            display: flex; align-items: flex-end; justify-content: center;
            width: 100%; height: auto; min-height: 320px; margin-top: 30px;
            padding: 0 15px; box-sizing: border-box;
        }

        .podium-item {
            display: flex; flex-direction: column; align-items: center;
            width: clamp(100px, 25vw, 130px); margin: 0 5px; position: relative;
        }

        /* 顶部黑圈 */
        .rank-top-badge {
            width: clamp(35px, 8vw, 45px); height: clamp(35px, 8vw, 45px); background: #000;
            border: 4px solid var(--gold); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Press+Start+2P', cursive; font-size: clamp(12px, 3vw, 16px); color: white;
            margin-bottom: -15px; z-index: 10;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        /* 白色信息卡片比例优化 */
        .info-card {
            background: #fff; border: 4px solid #000; border-radius: 6px;
            width: clamp(90px, 22vw, 110px); padding: 12px 5px; text-align: center;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15); z-index: 5;
            position: relative;
        }
        .info-card .num-label { font-size: clamp(18px, 4vw, 24px); font-weight: 900; color: var(--brick-main); display: block; }
        .info-card .rank-tag { font-size: clamp(8px, 2vw, 10px); color: #666; font-weight: bold; text-transform: uppercase; }
        .info-card .item-icon { font-size: clamp(16px, 4vw, 22px); margin: 6px 0; }
        .info-card .group-name { font-size: clamp(10px, 2.5vw, 13px); font-weight: bold; color: #000; word-wrap: break-word; }

        /* 极致细节砖块 */
        .brick-pillar {
            width: 100%; background: var(--brick-main);
            border: 4px solid #000;
            border-top: 10px solid var(--brick-light); /* 顶部亮边 */
            box-shadow: inset -8px -8px 0px var(--brick-dark); /* 侧面深色 */
            display: flex; justify-content: center; align-items: center;
        }
        .brick-pillar::after {
            content: ''; width: 80%; height: 4px; background: rgba(255,255,255,0.1); position: absolute; top: 10px;
        }

        .rank-1 .brick-pillar { height: clamp(120px, 25vw, 180px); z-index: 3; }
        .rank-2 .brick-pillar { height: clamp(90px, 20vw, 135px); z-index: 2; }
        .rank-3 .brick-pillar { height: clamp(70px, 15vw, 100px); z-index: 1; }

        /* --- 列表彩虹边框优化 --- */
        .list-container {
            width: 92%; max-width: 580px; margin: 40px 0 120px 0;
            padding: 8px; border-radius: 28px;
            background: linear-gradient(135deg, #ff4e50, #f9d423, #4ecca3, #4568dc, #b06ab3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .list-inner-body {
            background: white; border-radius: 22px; padding: 10px;
        }

        .row-entry {
            display: flex; justify-content: space-between; align-items: center;
            padding: clamp(12px, 3vw, 18px) clamp(15px, 4vw, 25px); border-bottom: 3px solid #f8f8f8;
            font-size: clamp(14px, 3vw, 22px); font-weight: bold; color: #333;
            flex-wrap: wrap; gap: 10px;
        }
        .row-entry:last-child { border-bottom: none; }
        .row-entry .val-score { color: var(--grass-green); }

        /* 环境背景 */
        .mario-cloud { position: fixed; background: #fff; width: clamp(60px, 12vw, 90px); height: clamp(25px, 5vw, 35px); border-radius: 20px; z-index: -1; animation: clouds 45s linear infinite; }
        .mario-cloud::before { content:''; position:absolute; background:#fff; width: clamp(30px, 6vw, 45px); height: clamp(30px, 6vw, 45px); top: clamp(-15px, -3vw, -20px); left:15px; border-radius:50%; }
        @keyframes clouds { from { left: -150px; } to { left: 110%; } }

        .mario-ground { position: fixed; bottom: 0; width: 100%; height: clamp(40px, 8vw, 60px); background: var(--grass-green); border-top: 6px solid #4d6621; z-index: 20; }
        .mario-dirt { position: absolute; bottom: 0; width: 100%; height: clamp(25px, 5vw, 40px); background: var(--dirt-brown); background-image: radial-gradient(#000 10%, transparent 10%); background-size: 15px 15px; }
        .mario-pipe { position: fixed; bottom: clamp(40px, 8vw, 60px); left: clamp(15px, 3vw, 30px); width: clamp(40px, 8vw, 55px); height: clamp(35px, 7vw, 50px); background: #73C316; border: 5px solid #000; z-index: 15; }
    </style>
</head>
<body>

    <div class="mario-cloud" style="top: 100px; animation-delay: -10s;"></div>
    <div class="mario-cloud" style="top: 220px; animation-delay: -30s;"></div>

    <header class="header">
        <h1>COMARADERIE '26<br>LEADERBOARD</h1>
    </header>

    <div class="podium-section" id="podium">
        </div>

    <div class="list-container">
        <div class="list-inner-body" id="list-body">
            </div>
    </div>

    <div class="mario-ground"><div class="mario-dirt"></div></div>
    <div class="mario-pipe"></div>

    <script>
        const teamData = [
            { name: "Group A", score: 0},
            { name: "Group B", score: 0},
            { name: "Group C", score: 0 },
            { name: "Group D", score: 34},
            { name: "Group E", score: 8 },
            { name: "Group F", score: 1013},
            { name: "Group G", score: 240},
            { name: "Group H", score: 10 },
            { name: "Group I", score: 185 },
            { name: "Group J", score: 185},
            { name: "Group K", score: 20 },
            { name: "Group L", score: 132},
            { name: "Group M", score: 6},
            { name: "Group N", score: 0 },
        ];

        function render() {
            const sorted = [...teamData].sort((a, b) => b.score - a.score);
            const podium = document.getElementById('podium');
            const list = document.getElementById('list-body');

            // 领奖台渲染 (顺序: 2, 1, 3)
            const pIdx = [1, 0, 2];
            const pRanks = [2, 1, 3];
            const pIcons = ["⭐", "🍄", "🟢"]; 

            podium.innerHTML = '';
            pIdx.forEach((idx, i) => {
                const team = sorted[idx];
                const r = pRanks[i];
                podium.innerHTML += `
                    <div class="podium-item rank-${r}">
                        <div class="rank-top-badge">${r}</div>
                        <div class="info-card">
                            <span class="rank-tag">RANK</span>
                            <span class="num-label">${r}</span>
                            <span class="val-score">${team.score} score</span>
                            <div class="item-icon">${pIcons[i]}</div>
                            <div class="group-name">${team.name}</div>
                        </div>
                        <div class="brick-pillar"></div>
                    </div>
                `;
            });

            // 列表渲染
            list.innerHTML = '';
            sorted.slice(3).forEach((team, i) => {
                list.innerHTML += `
                    <div class="row-entry">
                        <span>${i + 4} &nbsp; ${team.name}</span>
                        <span class="val-score">${team.score} score</span>
                    </div>
                `;
            });
        }
        render();
    </script>
</body>
</html>
